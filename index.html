<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>macOS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235b8af9'/%3E%3Cstop offset='1' stop-color='%239b59f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cg transform='translate(11 11) scale(0.109)' fill='%23fff'%3E%3Cpath d='M365 304c-9 21-13 30-25 50-16 27-39 60-67 60-26 0-33-17-68-17s-41 17-67 17c-28 0-49-29-66-56-57-93-63-202-28-266 24-45 63-72 99-72 27 0 53 18 72 18 18 0 46-21 79-18 14 1 52 5 77 39-2 1-46 27-45 80 1 62 51 83 52 84-1 1-9 28-23 61zM262 41c19-23 32-55 28-41 0 0-1 1-3 1-22 5-43 20-57 41-14 19-26 52-23 41 0 0 25-2 55-42z'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/windows.css">
<link rel="stylesheet" href="css/apps.css">
</head>
<body>
<div id="screen">
  <!-- ===== 开机 ===== -->
  <div id="boot">
    <svg class="boot-logo" viewBox="0 0 384 464" fill="#fff"><path d="M365 304c-9 21-13 30-25 50-16 27-39 60-67 60-26 0-33-17-68-17s-41 17-67 17c-28 0-49-29-66-56-57-93-63-202-28-266 24-45 63-72 99-72 27 0 53 18 72 18 18 0 46-21 79-18 14 1 52 5 77 39-2 1-46 27-45 80 1 62 51 83 52 84-1 1-9 28-23 61zM262 41c19-23 32-55 28-41 0 0-1 1-3 1-22 5-43 20-57 41-14 19-26 52-23 41 0 0 25-2 55-42z"/></svg>
  </div>

  <!-- ===== 登录 ===== -->
  <div id="login">
    <div class="backdrop"></div>
    <div class="login-avatar">
      <svg viewBox="0 0 24 24" fill="#fff" opacity=".92"><circle cx="12" cy="8" r="4.2"/><path d="M4 20c0-4 3.6-6.4 8-6.4s8 2.4 8 6.4v1H4v-1z"/></svg>
    </div>
    <div class="login-name">访客</div>
    <input id="login-pw" type="password" placeholder="输入密码以继续" autocomplete="off">
    <div class="login-hint" id="login-hint">密码已省略 — 点击或按回车进入桌面</div>
  </div>

  <!-- ===== 桌面 ===== -->
  <div id="desktop">
    <div id="wallpaper"></div>
    <div id="desktop-icons"></div>

    <!-- 菜单栏 -->
    <div id="menu-bar">
      <div class="menu-left">
        <div class="menu-item apple" id="m-apple">
          <svg viewBox="0 0 384 464"><path d="M365 304c-9 21-13 30-25 50-16 27-39 60-67 60-26 0-33-17-68-17s-41 17-67 17c-28 0-49-29-66-56-57-93-63-202-28-266 24-45 63-72 99-72 27 0 53 18 72 18 18 0 46-21 79-18 14 1 52 5 77 39-2 1-46 27-45 80 1 62 51 83 52 84-1 1-9 28-23 61zM262 41c19-23 32-55 28-41 0 0-1 1-3 1-22 5-43 20-57 41-14 19-26 52-23 41 0 0 25-2 55-42z"/></svg>
        </div>
        <div class="menu-appname" id="menu-appname">访客</div>
        <div class="menu-item m-hide" id="m-file" data-menu="file">文件</div>
        <div class="menu-item m-hide" id="m-edit" data-menu="edit">编辑</div>
        <div class="menu-item m-hide" id="m-view" data-menu="view">显示</div>
        <div class="menu-item m-hide" id="m-window" data-menu="win">窗口</div>
        <div class="menu-item m-hide" id="m-help" data-menu="help">帮助</div>
      </div>
      <div class="menu-right">
        <div class="menu-item" id="m-spot" title="聚焦搜索 (⌘空格)">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><line x1="16" y1="16" x2="20.5" y2="20.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </div>
        <div class="menu-item" id="m-cc" title="控制中心">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="9" rx="2.5"/><rect x="3" y="16" width="8" height="4" rx="2"/><rect x="14" y="16" width="7" height="4" rx="2" fill="currentColor"/><rect x="6" y="6.5" width="12" height="4" rx="2"/><circle cx="6.5" cy="18" r="1.4" fill="currentColor"/><circle cx="17.5" cy="18" r="1.4" fill="currentColor"/></svg>
        </div>
        <div class="menu-item" id="m-wifi" title="Wi-Fi">
          <svg viewBox="0 0 24 24"><path d="M12 19.5a1.8 1.8 0 100-3.6 1.8 1.8 0 000 3.6z"/><path d="M7.2 13.6a6.8 6.8 0 019.6 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M3.6 9.3a11.6 11.6 0 0116.8 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <div class="menu-item" id="m-batt" title="电池 82%">
          <svg viewBox="0 0 26 14"><rect x="0.8" y="1.2" width="21" height="11.6" rx="3" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".5"/><rect x="2.6" y="3" width="14" height="8" rx="1.6" fill="currentColor" id="batt-fill"/><path d="M23.4 5v4c1.4-.3 1.8-1 1.8-2s-.4-1.7-1.8-2z" fill="currentColor" opacity=".5"/></svg>
          <span id="batt-pct" style="font-size:12px;margin-left:2px">82%</span>
        </div>
        <div class="menu-item" id="menu-clock" title=""></div>
      </div>
    </div>

    <!-- 窗口层 -->
    <div id="windows"></div>

    <!-- Dock -->
    <div id="dock-zone"><div id="dock"></div></div>

    <!-- 启动台 -->
    <div id="launchpad">
      <input class="search" id="lp-search" placeholder="搜索">
      <div id="lp-grid"></div>
      <div id="lp-empty">没有找到匹配的应用</div>
    </div>

    <!-- 控制中心 -->
    <div id="control-center">
      <div class="cc-grid">
        <div class="cc-cell">
          <div class="t">Wi-Fi</div>
          <div class="cc-toggle" id="cc-wifi">
            <span class="lbl">无线局域网</span>
            <span class="cc-switch on" id="cc-wifi-sw"></span>
          </div>
        </div>
        <div class="cc-cell">
          <div class="t">蓝牙</div>
          <div class="cc-toggle" id="cc-bt">
            <span class="lbl">蓝牙</span>
            <span class="cc-switch on" id="cc-bt-sw"></span>
          </div>
        </div>
        <div class="cc-cell">
          <div class="t">隔空投送</div>
          <div class="cc-toggle" id="cc-ad">
            <span class="lbl">接收关闭</span>
            <span class="cc-switch" id="cc-ad-sw"></span>
          </div>
        </div>
        <div class="cc-cell">
          <div class="t">深色模式</div>
          <div class="cc-toggle" id="cc-dark">
            <span class="lbl">外观</span>
            <span class="cc-switch" id="cc-dark-sw"></span>
          </div>
        </div>
        <div class="cc-cell wide cc-slider">
          <div class="t">亮度</div>
          <input type="range" id="cc-bright" min="40" max="100" value="92">
          <div class="val" id="cc-bright-v">92%</div>
        </div>
        <div class="cc-cell wide cc-slider">
          <div class="t">声音</div>
          <input type="range" id="cc-vol" min="0" max="100" value="70">
          <div class="val" id="cc-vol-v">70%</div>
        </div>
        <div class="cc-cell wide cc-now" id="cc-now">
          <div class="art" id="cc-now-art"></div>
          <div style="min-width:0">
            <div class="tt" id="cc-now-tt">未在播放</div>
            <div class="ar" id="cc-now-ar"></div>
          </div>
          <div class="ctr">
            <svg id="cc-now-prev" viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5l-11 7 11 7z"/></svg>
            <svg id="cc-now-play" viewBox="0 0 24 24"><path id="cc-play-path" d="M8 5l12 7-12 7z"/></svg>
            <svg id="cc-now-next" viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></svg>
          </div>
        </div>
      </div>
    </div>

    <!-- 聚焦搜索 -->
    <div id="spotlight">
      <div class="veil" id="sp-veil"></div>
      <div class="box">
        <input id="sp-input" placeholder="聚焦搜索" autocomplete="off">
        <div id="sp-results"></div>
        <div id="sp-empty">没有结果</div>
      </div>
    </div>

    <!-- 右键菜单容器 -->
    <div class="ctxmenu" id="ctx-menu"></div>

    <!-- 系统下拉菜单容器 -->
    <div class="dropdown" id="sys-dropdown"></div>

    <!-- 提示 -->
    <div id="toast"></div>

    <!-- 关机/重启/睡眠 -->
    <div id="power">
      <div class="pwr-btn" id="pwr-btn">
        <svg viewBox="0 0 24 24"><path d="M12 2.5a1 1 0 011 1V12a1 1 0 11-2 0V3.5a1 1 0 011-1z"/><path d="M6.3 5.6a8 8 0 1011.4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <div class="pwr-hint" id="pwr-hint">点击开机</div>
      <div class="pwr-progress" id="pwr-progress">
        <div class="bar"><i></i></div>
        <span>正在重新启动…</span>
      </div>
    </div>
  </div>
</div>
<script src="js/01-core.js"></script>
<script src="js/02-window.js"></script>
<script src="js/03-finder-safari.js"></script>
<script src="js/04-terminal-calc.js"></script>
<script src="js/05-social.js"></script>
<script src="js/06-system-apps.js"></script>
<script src="js/07-ui.js"></script>
</body>
</html>
