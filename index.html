<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>macOS 复刻 · HTML + CSS + JS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235b8af9'/%3E%3Cstop offset='1' stop-color='%239b59f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cg transform='translate(11 11) scale(0.109)' fill='%23fff'%3E%3Cpath d='M365 304c-9 21-13 30-25 50-16 27-39 60-67 60-26 0-33-17-68-17s-41 17-67 17c-28 0-49-29-66-56-57-93-63-202-28-266 24-45 63-72 99-72 27 0 53 18 72 18 18 0 46-21 79-18 14 1 52 5 77 39-2 1-46 27-45 80 1 62 51 83 52 84-1 1-9 28-23 61zM262 41c19-23 32-55 28-41 0 0-1 1-3 1-22 5-43 20-57 41-14 19-26 52-23 41 0 0 25-2 55-42z'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* ===================== 设计令牌 ===================== */
:root{
  --bg:#f5f5f7; --bg-side:#ececf0; --bg-input:rgba(118,118,128,.12);
  --text:#1d1d1f; --text-2:#6e6e73; --text-3:#98989d;
  --accent:#007aff; --accent-hi:#0a84ff;
  --red:#ff5f57; --yellow:#febc2e; --green:#28c840;
  --sep:rgba(0,0,0,.09); --hover:rgba(0,0,0,.055); --sel:rgba(0,122,255,.14);
  --menu-bg:rgba(250,250,252,.58); --dock-bg:rgba(255,255,255,.44);
  --win-bg:#f6f6f8; --win-side:#ececf0;
  --shadow:0 22px 70px rgba(0,0,0,.35);
  --blur:blur(28px) saturate(180%);
  --glass-border:rgba(255,255,255,.55);
  --dock-border:rgba(255,255,255,.6);
  --traffic-dim:#b8b8bd;
}
body.dark{
  --bg:#1e1e20; --bg-side:#26262a; --bg-input:rgba(118,118,128,.24);
  --text:#f5f5f7; --text-2:#a1a1a6; --text-3:#7d7d83;
  --accent:#0a84ff; --accent-hi:#409cff;
  --sep:rgba(255,255,255,.12); --hover:rgba(255,255,255,.085); --sel:rgba(10,132,255,.26);
  --menu-bg:rgba(28,28,30,.66); --dock-bg:rgba(26,26,28,.46);
  --win-bg:#2a2a2e; --win-side:#242428;
  --shadow:0 22px 70px rgba(0,0,0,.6);
  --glass-border:rgba(255,255,255,.12);
  --dock-border:rgba(255,255,255,.14);
  --traffic-dim:#5b5b60;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--text); background:#000; -webkit-font-smoothing:antialiased;
  user-select:none; cursor:default;
}
svg{display:block}
input,textarea{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,.45);border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(128,128,128,.7);background-clip:content-box;border:2px solid transparent}
::-webkit-scrollbar-corner{background:transparent}

#screen{position:fixed;inset:0;overflow:hidden}

/* ===================== 开机画面 ===================== */
#boot{
  position:absolute;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:5000;
  transition:opacity .55s ease; pointer-events:auto;
}
#boot.hide{opacity:0;pointer-events:none}
.boot-logo{width:90px;height:auto;opacity:0;animation:bootIn 1s ease .1s forwards}
@keyframes bootIn{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:scale(1)}}

/* ===================== 登录画面 ===================== */
#login{
  position:absolute;inset:0;z-index:4000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background-size:cover;background-position:center;transition:opacity .5s ease,visibility .5s;
  opacity:1;visibility:visible;
}
#login.hide{opacity:0;visibility:hidden}
#login .backdrop{position:absolute;inset:0;background:var(--wallpaper);background-size:cover;background-position:center;filter:blur(6px) brightness(.92) saturate(1.1) scale(1.08)}
.login-avatar{
  width:92px;height:92px;border-radius:50%;position:relative;overflow:hidden;
  background:radial-gradient(circle at 30% 25%,#9aa8ff,#5b6cf0 55%,#3844b0);
  box-shadow:0 4px 18px rgba(0,0,0,.35),inset 0 0 0 1.5px rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;
}
.login-avatar svg{width:58px;height:58px;margin-top:34px}
.login-name{color:#fff;font-size:21px;font-weight:600;text-shadow:0 1px 8px rgba(0,0,0,.45)}
#login input{
  width:190px;padding:8px 14px;border-radius:22px;border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.22);color:#fff;font-size:16px;text-align:center;outline:none;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:background .2s;
}
#login input::placeholder{color:rgba(255,255,255,.75);font-size:14px}
#login input:focus{background:rgba(255,255,255,.3)}
.login-hint{color:rgba(255,255,255,.82);font-size:14px;text-shadow:0 1px 6px rgba(0,0,0,.4);cursor:pointer;padding:6px 14px;border-radius:8px;transition:background .2s}
.login-hint:hover{background:rgba(255,255,255,.15)}
#login-pw.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.apple-glyph{font-family:-apple-system,"Apple Symbols","Helvetica Neue","PingFang SC",sans-serif;display:inline-block;line-height:1;color:inherit}
#m-apple .apple-glyph{font-size:16px}
.boot-glyph{font-size:74px;color:#fff;opacity:0;animation:bootIn 1s ease .1s forwards}

/* ===================== 桌面 ===================== */
#desktop{position:absolute;inset:0;visibility:hidden;opacity:0;transition:opacity .5s ease}
#desktop.on{visibility:visible;opacity:1}
#wallpaper{position:absolute;inset:0;background:var(--wallpaper,#3b3b3f);background-size:cover;background-position:center;transition:filter .3s}
body.wallpaper-dark #wallpaper{filter:brightness(.75)}
#desktop.veil::after{content:"";position:absolute;inset:0;background:#000;opacity:var(--veil,0);pointer-events:none;transition:opacity .25s}

/* 桌面图标 */
#desktop-icons{position:absolute;inset:0;padding:16px 14px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:4px;z-index:5}
.desk-icon{
  width:88px;padding:7px 4px 6px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:5px;
  color:#fff;font-size:12px;font-weight:500;text-align:center;text-shadow:0 1px 5px rgba(0,0,0,.75);
  cursor:default;position:relative;
}
.desk-icon .ic{width:54px;height:54px;display:inline-flex;align-items:center;justify-content:center;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
.desk-icon .ic svg{width:100%;height:100%}
.desk-icon .nm{line-height:1.25;max-width:84px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-align:center;padding:1px 5px;border-radius:4px;word-break:break-all}
.f-ic,.sp-ic,.lp-ic{display:inline-flex;align-items:center;justify-content:center}
.f-ic svg,.sp-ic svg,.lp-ic svg{width:100%;height:100%}
.desk-icon.selected{background:rgba(0,90,220,.28)}
.desk-icon.selected .nm{background:rgba(0,90,220,.85)}
.desk-icon .badge{position:absolute;top:3px;right:12px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center;padding:0 5px;box-shadow:0 1px 4px rgba(0,0,0,.4);font-weight:600}

/* ===================== 菜单栏 ===================== */
#menu-bar{
  position:absolute;top:0;left:0;right:0;height:28px;z-index:800;display:flex;align-items:center;justify-content:space-between;
  padding:0 10px 0 14px;font-size:13px;color:var(--text);
  background:var(--menu-bg);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-bottom:1px solid var(--sep);
}
body.dark #menu-bar{color:#fff}
.menu-left{display:flex;align-items:center;height:100%}
.menu-item{display:flex;align-items:center;gap:6px;height:100%;padding:0 9px;border-radius:5px;position:relative;cursor:default}
.menu-item:hover,.menu-item.open{background:var(--hover)}
.menu-item.apple{padding:0 8px}
.menu-item.apple svg{width:15px;height:15px;fill:currentColor}
.menu-appname{font-weight:700;padding:0 8px;height:100%;display:flex;align-items:center;white-space:nowrap}
.menu-right{display:flex;align-items:center;height:100%;gap:2px}
.menu-right .menu-item{padding:0 7px}
.menu-right svg{width:16px;height:16px;fill:currentColor}
#menu-clock{font-variant-numeric:tabular-nums;cursor:default}
#menu-clock .mini{display:none}

/* 下拉菜单 */
.dropdown{
  position:fixed;min-width:210px;background:var(--win-bg);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--sep);border-radius:9px;box-shadow:0 10px 40px rgba(0,0,0,.28);
  padding:5px 6px;z-index:5000;display:none;font-size:13px;color:var(--text);
}
.dropdown.show{display:block;animation:ddIn .12s ease}
@keyframes ddIn{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.dd-item{display:flex;align-items:center;gap:9px;padding:4px 10px;border-radius:5px;cursor:default;white-space:nowrap}
.dd-item:hover{background:var(--accent);color:#fff}
.dd-item.dim{color:var(--text-3)}
.dd-item.dim:hover{color:#fff}
.dd-sep{height:1px;background:var(--sep);margin:5px 8px}
.dd-item .short{margin-left:auto;font-size:12px;color:var(--text-3);padding-left:24px}
.dd-item:hover .short{color:rgba(255,255,255,.85)}
.dd-item svg{width:15px;height:15px;flex:none}

/* ===================== 窗口 ===================== */
#windows{position:absolute;inset:28px 0 0 0;z-index:100;pointer-events:none}
.window{
  position:absolute;min-width:260px;min-height:160px;border-radius:12px;overflow:hidden;
  background:var(--win-bg);color:var(--text);
  box-shadow:var(--shadow);border:1px solid var(--sep);
  display:flex;flex-direction:column;pointer-events:auto;
  animation:winIn .28s cubic-bezier(.3,.9,.3,1);
}
@keyframes winIn{from{opacity:0;transform:scale(.92) translateY(14px)}to{opacity:1;transform:none}}
.window.minimizing{transition:all .34s cubic-bezier(.4,0,.6,1);opacity:0;transform:scale(.1) translateY(60vh);pointer-events:none}
.window.closing{animation:winOut .18s ease forwards}
@keyframes winOut{to{opacity:0;transform:scale(.94)}}
.window.focused{box-shadow:0 24px 80px rgba(0,0,0,.42)}
body.dark .window.focused{box-shadow:0 24px 80px rgba(0,0,0,.7)}
.window.maxed{border-radius:0}
.titlebar{
  height:38px;flex:none;display:flex;align-items:center;padding:0 12px;position:relative;
  background:linear-gradient(var(--win-bg),color-mix(in srgb,var(--win-bg) 88%,#000 0%));
  border-bottom:1px solid var(--sep);cursor:default;
}
body.dark .titlebar{background:linear-gradient(var(--win-bg),#2c2c30)}
.traffic{display:flex;gap:8px;align-items:center;z-index:2}
.tlight{width:12px;height:12px;border-radius:50%;position:relative;transition:filter .12s}
.tlight.close{background:var(--red);border:1px solid rgba(0,0,0,.14)}
.tlight.min{background:var(--yellow);border:1px solid rgba(0,0,0,.12)}
.tlight.max{background:var(--green);border:1px solid rgba(0,0,0,.12)}
.tlight::before,.tlight::after{content:"";position:absolute;opacity:0;transition:opacity .12s;background:rgba(0,0,0,.55)}
.tlight.close::before,.tlight.close::after{left:3px;top:5px;width:5px;height:1.4px}
.tlight.close::before{transform:rotate(45deg)}.tlight.close::after{transform:rotate(-45deg)}
.tlight.min::before{left:2.5px;top:5.4px;width:7px;height:1.4px}
.tlight.max::before{left:2px;top:5.2px;width:8px;height:8px;border:1.4px solid rgba(0,0,0,.6);border-radius:1.5px;background:transparent}
.window:not(.focused) .tlight{background:var(--traffic-dim);border-color:rgba(0,0,0,.1)}
.window:not(.focused) .tlight::before,.window:not(.focused) .tlight::after{opacity:0}
.tlight:hover::before,.tlight:hover::after{opacity:1}
.win-title{
  position:absolute;left:0;right:0;text-align:center;font-size:13px;font-weight:600;color:var(--text-2);
  pointer-events:none;display:flex;align-items:center;justify-content:center;gap:7px;
}
.win-title .app-ic{width:16px;height:16px;border-radius:4px}
.win-body{flex:1;position:relative;overflow:hidden;display:flex;min-height:0}
.window.focused .win-title{color:var(--text)}
.r-handle{position:absolute;z-index:9}
.r-e{top:0;right:-3px;width:6px;height:100%;cursor:ew-resize}
.r-w{top:0;left:-3px;width:6px;height:100%;cursor:ew-resize}
.r-n{top:-3px;left:0;height:6px;width:100%;cursor:ns-resize}
.r-s{bottom:-3px;left:0;height:6px;width:100%;cursor:ns-resize}
.r-ne{top:-3px;right:-3px;width:10px;height:10px;cursor:nesw-resize}
.r-nw{top:-3px;left:-3px;width:10px;height:10px;cursor:nwse-resize}
.r-se{bottom:-3px;right:-3px;width:14px;height:14px;cursor:nwse-resize}
.r-sw{bottom:-3px;left:-3px;width:10px;height:10px;cursor:nesw-resize}

/* ===================== Dock ===================== */
#dock-zone{position:absolute;left:0;right:0;bottom:0;z-index:700;display:flex;justify-content:center;pointer-events:none}
#dock{
  pointer-events:auto;display:flex;align-items:flex-end;gap:6px;padding:8px 10px;border-radius:20px;
  background:var(--dock-bg);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--dock-border);box-shadow:0 10px 40px rgba(0,0,0,.3);
  margin-bottom:8px;
}
.dock-icon{
  width:52px;height:52px;border-radius:12px;position:relative;cursor:pointer;flex:none;
  transition:transform .18s cubic-bezier(.34,1.3,.5,1),margin .18s;
  transform-origin:bottom center;display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.25));
}
.dock-icon img,.dock-icon svg{width:100%;height:100%;border-radius:12px}
.dock-icon .tip{
  position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) scale(.85);opacity:0;pointer-events:none;
  background:rgba(45,45,50,.92);color:#fff;font-size:12px;padding:3px 10px;border-radius:6px;white-space:nowrap;
  transition:all .15s;box-shadow:0 3px 10px rgba(0,0,0,.3);z-index:60;
}
.dock-icon:hover .tip{opacity:1;transform:translateX(-50%) scale(1)}
.dock-icon .run-dot{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:#1d1d1f;opacity:0}
body.dark .dock-icon .run-dot{background:#e5e5ea}
.dock-icon.running .run-dot{opacity:.9}
.dock-icon .open-dot{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:#1d1d1f;opacity:0}
body.dark .dock-icon .open-dot{background:#e5e5ea}
.dock-icon.open .open-dot{opacity:.9}
.dock-sep{width:1px;height:44px;align-self:center;background:var(--sep);margin:0 5px;border-radius:1px}
.dock-trash{margin-left:2px}

/* ===================== Launchpad ===================== */
#launchpad{
  position:absolute;inset:0;z-index:1500;background:var(--wallpaper);background-size:cover;background-position:center;
  backdrop-filter:blur(40px) saturate(1.4);-webkit-backdrop-filter:blur(40px) saturate(1.4);
  display:flex;flex-direction:column;align-items:center;padding-top:92px;visibility:hidden;opacity:0;
  transition:opacity .22s ease,visibility .22s;
}
#launchpad.on{visibility:visible;opacity:1}
#launchpad .search{
  width:300px;max-width:78vw;padding:9px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.25);color:#fff;font-size:16px;text-align:center;outline:none;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-bottom:40px;
}
#launchpad .search::placeholder{color:rgba(255,255,255,.7)}
#lp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:18px 10px;width:min(880px,92vw);overflow-y:auto;padding-bottom:60px}
.lp-app{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;padding:8px 4px;border-radius:12px;transition:background .15s}
.lp-app:hover{background:rgba(255,255,255,.16)}
.lp-app:hover .lp-ic{animation:wiggle .32s ease}
@keyframes wiggle{0%{transform:rotate(0)}25%{transform:rotate(-4deg)}50%{transform:rotate(3deg)}75%{transform:rotate(-2deg)}100%{transform:rotate(0)}}
.lp-app .lp-ic{width:72px;height:72px;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.lp-app .nm{color:#fff;font-size:12.5px;font-weight:500;text-shadow:0 1px 6px rgba(0,0,0,.6)}
#lp-empty{color:rgba(255,255,255,.8);font-size:15px;display:none;margin-top:40px}

/* ===================== 控制中心 ===================== */
#control-center{
  position:fixed;top:32px;right:8px;width:330px;z-index:3500;background:var(--menu-bg);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--sep);
  border-radius:16px;box-shadow:0 18px 60px rgba(0,0,0,.35);padding:12px;display:none;
  font-size:13px;color:var(--text);
}
#control-center.show{display:block;animation:ddIn .16s ease}
.cc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc-cell{border-radius:14px;background:var(--hover);padding:12px 12px 10px;transition:background .15s}
.cc-cell.wide{grid-column:1/-1}
.cc-cell .t{font-size:12px;color:var(--text-2);margin-bottom:8px;font-weight:500}
.cc-toggle{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.cc-toggle .lbl{font-weight:600;font-size:13.5px}
.cc-switch{width:36px;height:22px;border-radius:11px;background:rgba(120,120,128,.3);position:relative;transition:background .2s;flex:none}
.cc-switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:left .2s}
.cc-switch.on{background:var(--accent)}
.cc-switch.on::after{left:16px}
.cc-slider input{width:100%;accent-color:var(--accent);height:4px}
.cc-slider .val{font-size:11px;color:var(--text-3);text-align:right;margin-top:2px}
.cc-now{display:flex;align-items:center;gap:12px}
.cc-now .art{width:44px;height:44px;border-radius:9px;flex:none;overflow:hidden}
.cc-now .tt{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-now .ar{font-size:11.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-now .ctr{display:flex;align-items:center;gap:14px;margin-left:auto;color:var(--text)}
.cc-now .ctr svg{width:20px;height:20px;cursor:pointer;fill:currentColor}

/* ===================== 聚焦搜索 ===================== */
#spotlight{
  position:absolute;top:0;left:0;right:0;bottom:0;z-index:3000;display:flex;flex-direction:column;align-items:center;padding-top:22vh;
  visibility:hidden;opacity:0;transition:opacity .18s ease,visibility .18s;
}
#spotlight.on{visibility:visible;opacity:1}
#spotlight .veil{position:absolute;inset:0;background:rgba(0,0,0,.12);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#spotlight .box{position:relative;width:min(640px,92vw);background:var(--win-bg);border-radius:12px;box-shadow:0 20px 70px rgba(0,0,0,.4);overflow:hidden;border:1px solid var(--sep)}
#spotlight input{
  width:100%;padding:16px 20px;font-size:20px;background:transparent;border:none;outline:none;color:var(--text);
}
#sp-results{max-height:380px;overflow-y:auto;padding:6px}
.sp-item{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:8px;cursor:default;font-size:14px}
.sp-item.hl{background:var(--accent);color:#fff}
.sp-item .sp-ic{width:30px;height:30px;border-radius:7px;flex:none}
.sp-item .sp-sub{margin-left:auto;font-size:12px;color:var(--text-3)}
.sp-item.hl .sp-sub{color:rgba(255,255,255,.8)}
#sp-empty{padding:16px 20px;font-size:14px;color:var(--text-2);display:none}

/* ===================== 通用浮层 ===================== */
.ctxmenu{
  position:fixed;min-width:200px;background:var(--menu-bg);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--sep);border-radius:9px;box-shadow:0 12px 44px rgba(0,0,0,.3);padding:5px 6px;z-index:6000;
  font-size:13px;color:var(--text);display:none;
}
.ctxmenu.show{display:block;animation:ddIn .1s ease}
#toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(14px);z-index:9000;
  background:rgba(40,40,44,.88);color:#fff;font-size:13px;padding:9px 18px;border-radius:10px;
  box-shadow:0 8px 30px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:all .25s;max-width:86vw;text-align:center;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 自定义 macOS 指针 */
#mac-cursor{position:fixed;left:0;top:0;z-index:99999;pointer-events:none;display:none;transform:translate(-1px,-1px);filter:drop-shadow(1px 2px 2px rgba(0,0,0,.35))}
body.mac-cursor-mode #screen{cursor:none}
body.mac-cursor-mode input,body.mac-cursor-mode textarea,body.mac-cursor-mode [contenteditable]{cursor:text}
@media (pointer:coarse){#mac-cursor{display:none!important}}

/* 关机 / 重启 / 睡眠 */
#power{
  position:absolute;inset:0;z-index:9500;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;
  opacity:0;visibility:hidden;transition:opacity .8s ease;
}
#power.on{opacity:1;visibility:visible}
#power .pwr-btn{
  width:74px;height:74px;border-radius:50%;border:2px solid rgba(255,255,255,.7);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background .2s;
}
#power .pwr-btn:hover{background:rgba(255,255,255,.14)}
#power .pwr-btn svg{width:30px;height:30px;fill:currentColor}
#power .pwr-hint{color:rgba(255,255,255,.65);font-size:13px}
#power .pwr-progress{display:none;flex-direction:column;align-items:center;gap:18px;color:rgba(255,255,255,.75);font-size:13px}
#power .pwr-progress .bar{width:120px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}
#power .pwr-progress .bar i{display:block;height:100%;width:0;background:#fff;transition:width 1.6s ease}

/* ===================== 通用 UI 组件 ===================== */
.btn{
  padding:5px 14px;border-radius:7px;background:var(--accent);color:#fff;font-size:13px;border:none;cursor:default;
  transition:filter .15s;
}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--hover);color:var(--text)}
.btn.sm{padding:2px 10px;font-size:12px}
input[type=text],input[type=search]{outline:none}
.tb-toolbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--bg);border-bottom:1px solid var(--sep);flex:none}
.tb-btn{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text-2);cursor:default}
.tb-btn svg{width:16px;height:16px;fill:currentColor}
.tb-btn:hover{background:var(--hover);color:var(--text)}
.tb-btn.dis{opacity:.35;pointer-events:none}
.tb-seg{display:flex;background:var(--bg-input);border-radius:7px;padding:2px}
.tb-seg .seg{width:28px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:5px;color:var(--text-2);cursor:default}
.tb-seg .seg svg{width:15px;height:15px;fill:currentColor}
.tb-seg .seg.on{background:var(--win-bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.sidebar{width:190px;flex:none;background:var(--win-side);border-right:1px solid var(--sep);padding:10px 8px;overflow-y:auto;font-size:13px}
.sidebar .sec{font-size:11px;color:var(--text-3);padding:8px 10px 4px;font-weight:600;letter-spacing:.2px}
.sidebar .row{display:flex;align-items:center;gap:8px;padding:4px 10px;border-radius:6px;cursor:default;color:var(--text)}
.sidebar .row:hover{background:var(--hover)}
.sidebar .row.on{background:var(--sel);color:var(--accent)}
.sidebar .row svg{width:15px;height:15px;flex:none;fill:currentColor;opacity:.85}
.sidebar .row .cnt{margin-left:auto;font-size:11px;color:var(--text-3)}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--text-3);font-size:14px}
.empty-state svg{width:72px;height:72px;opacity:.5}
/* ===================== 访达 ===================== */
.finder-main{flex:1;display:flex;flex-direction:column;min-width:0}
.finder-path{padding:7px 12px;font-size:13px;color:var(--text-2);background:var(--bg);border-bottom:1px solid var(--sep);flex:none;display:flex;gap:4px;align-items:center;white-space:nowrap;overflow:hidden}
.finder-path b{color:var(--text);font-weight:500}
.file-list{flex:1;overflow-y:auto;padding:8px 6px;display:flex;flex-direction:column;align-content:flex-start;flex-wrap:wrap;gap:2px;align-content:flex-start}
.file-row{display:flex;align-items:center;gap:9px;padding:5px 10px;border-radius:7px;font-size:13px;width:100%;max-width:340px;cursor:default}
.file-row:hover{background:var(--hover)}
.file-row.on{background:var(--sel)}
.file-row .f-ic{width:22px;height:22px;flex:none}
.file-row .f-sub{margin-left:auto;font-size:11.5px;color:var(--text-3)}
.file-grid{flex:1;overflow-y:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;align-content:start}
.file-grid .file-row{flex-direction:column;width:auto;max-width:none;padding:9px 6px;gap:6px;text-align:center}
.file-grid .file-row .f-ic{width:46px;height:46px}
.file-grid .file-row .f-sub{display:none}

/* ===================== Safari ===================== */
.safari-toolbar{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--bg);border-bottom:1px solid var(--sep);flex:none}
.safari-url{
  flex:1;display:flex;align-items:center;gap:8px;background:var(--bg-input);border-radius:8px;padding:5px 12px;
  font-size:13px;color:var(--text-2);cursor:text;min-width:0;
}
.safari-url input{flex:1;background:transparent;border:none;outline:none;font-size:13px;color:var(--text)}
.safari-url svg{width:14px;height:14px;fill:var(--text-3);flex:none}
.safari-body{flex:1;position:relative;display:flex;flex-direction:column;background:var(--bg)}
.safari-iframe{flex:1;border:none;width:100%;height:100%;background:#fff}
.sf-start{flex:1;overflow-y:auto;padding:40px 30px;background:var(--bg)}
.sf-favs{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:20px 12px;max-width:720px;margin:0 auto}
.sf-fav{display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer;padding:10px 4px;border-radius:10px}
.sf-fav:hover{background:var(--hover)}
.sf-fav .fl{width:58px;height:58px;border-radius:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.sf-fav .fl svg{width:30px;height:30px;fill:#fff}
.sf-fav .nm{font-size:12px;color:var(--text-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sf-offline{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px;text-align:center;background:var(--bg)}
.sf-offline .wifi{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd9a0,#ff9f45 55%,#f0762a);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(240,118,42,.35)}
.sf-offline .wifi svg{width:52px;height:52px;fill:#fff}
.sf-offline h2{font-size:22px;font-weight:700}
.sf-offline p{font-size:13.5px;color:var(--text-2);line-height:1.7;max-width:400px}

/* ===================== 终端 ===================== */
.terminal{
  flex:1;background:rgba(20,20,24,.96);color:#e8e8ec;font-family:"SF Mono",Menlo,Consolas,"Courier New",monospace;
  font-size:12.5px;line-height:1.55;padding:10px 12px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;user-select:text;
}
.terminal .t-line{display:flex;gap:8px;flex-wrap:wrap}
.terminal .t-prompt{color:#6ee7b7;flex:none}
.terminal .t-in{color:#fff;outline:none;flex:1;min-width:120px;caret-color:#fff}
.terminal .c-out{color:#b9bcc4}
.terminal .c-err{color:#ff7b72}
.terminal .c-ok{color:#7ee787}
.terminal .c-dim{color:#8b949e}
.terminal .c-yel{color:#ffd28a}
.terminal .c-cyn{color:#79c0ff}
.terminal .c-mag{color:#d2a8ff}

/* ===================== 计算器 ===================== */
.calc{flex:1;display:flex;flex-direction:column;background:#2c2c2e;padding:10px;gap:1px}
.calc-disp{flex:1;display:flex;align-items:flex-end;justify-content:flex-end;padding:8px 12px 12px;font-size:52px;font-weight:300;color:#fff;font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap;font-family:"SF Mono",Menlo,Consolas,monospace;min-height:96px}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(255,255,255,.05);border-radius:10px;overflow:hidden}
.calc-btn{height:56px;display:flex;align-items:center;justify-content:center;font-size:21px;color:#fff;background:#5b5b60;cursor:default;user-select:none;position:relative}
.calc-btn:hover{filter:brightness(1.22)}
.calc-btn:active{filter:brightness(.9)}
.calc-btn.fn{background:#3d3d41}
.calc-btn.op{background:#ff9f0a;font-size:26px}
.calc-btn.op.on{background:#fff;color:#ff9f0a}
.calc-btn.zero{grid-column:span 2;border-radius:0 0 0 10px}

/* ===================== 备忘录 ===================== */
.notes-main{flex:1;display:flex;min-width:0}
.notes-list{width:230px;flex:none;border-right:1px solid var(--sep);overflow-y:auto;background:var(--bg)}
.note-item{padding:10px 12px;border-bottom:1px solid var(--sep);cursor:default}
.note-item:hover{background:var(--hover)}
.note-item.on{background:var(--sel)}
.note-item .tt{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-item .pr{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.notes-editor{flex:1;display:flex;flex-direction:column;min-width:0}
.notes-toolbar{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--sep);font-size:12px;color:var(--text-3)}
.notes-toolbar .ttl{font-weight:600;color:var(--text);font-size:13px}
.notes-area{flex:1;border:none;outline:none;resize:none;padding:16px 20px;font-size:14.5px;line-height:1.7;background:var(--win-bg);color:var(--text);font-family:inherit}
.notes-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text-3);font-size:14px}

/* ===================== 信息 ===================== */
.msg-main{flex:1;display:flex;min-width:0}
.msg-list{width:250px;flex:none;border-right:1px solid var(--sep);overflow-y:auto;background:var(--bg)}
.msg-conv{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:default}
.msg-conv:hover{background:var(--hover)}
.msg-conv.on{background:var(--sel)}
.msg-conv .av{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:600}
.msg-conv .nm{font-size:13.5px;font-weight:600}
.msg-conv .last{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.msg-conv .bdg{min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;line-height:17px;text-align:center;padding:0 5px;margin-left:auto;font-weight:600}
.msg-chat{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--win-bg)}
.msg-head{padding:9px 14px;border-bottom:1px solid var(--sep);font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.msg-head .av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600}
.msg-bubbles{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:3px}
.bubble{max-width:72%;padding:7px 12px;border-radius:16px;font-size:13.5px;line-height:1.45;align-self:flex-start;background:var(--bg-side);margin-bottom:2px}
.bubble.me{align-self:flex-end;background:var(--accent);color:#fff}
.bubble .bt{font-size:10px;opacity:.65;margin-top:2px;text-align:right}
.msg-input{display:flex;gap:8px;padding:9px 12px;border-top:1px solid var(--sep)}
.msg-input input{flex:1;background:var(--bg-input);border:none;border-radius:18px;padding:7px 14px;font-size:13.5px;color:var(--text);outline:none}
.msg-input .send{width:30px;height:30px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;cursor:default}
.msg-input .send svg{width:15px;height:15px;fill:currentColor}

/* ===================== 邮件 ===================== */
.mail-main{flex:1;display:flex;min-width:0}
.mail-list{width:230px;flex:none;border-right:1px solid var(--sep);overflow-y:auto;background:var(--bg)}
.mail-item{padding:9px 12px;border-bottom:1px solid var(--sep);cursor:default}
.mail-item:hover{background:var(--hover)}
.mail-item.on{background:var(--sel)}
.mail-item.unread .from{font-weight:700}
.mail-item .from{font-size:13px;display:flex;align-items:center;gap:6px}
.mail-item .from .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.mail-item.unread .dot{background:var(--accent)}
.mail-item .subj{font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.mail-item .pre{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.mail-read{flex:1;display:flex;flex-direction:column;min-width:0}
.mail-toolbar{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--sep);background:var(--bg)}
.mail-body{flex:1;overflow-y:auto;padding:22px 28px;font-size:14px;line-height:1.75}
.mail-body h2{font-size:20px;margin-bottom:10px;font-weight:700}
.mail-meta{font-size:12.5px;color:var(--text-3);margin-bottom:18px;display:flex;flex-direction:column;gap:2px}
.mail-msg{white-space:pre-wrap;word-break:break-word}

/* ===================== 日历 ===================== */
.cal-main{flex:1;display:flex;flex-direction:column;padding:14px;gap:10px;background:var(--win-bg)}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.cal-head .m{font-size:20px;font-weight:700}
.cal-nav{display:flex;gap:4px;align-items:center}
.cal-nav button{width:26px;height:26px;border-radius:6px;border:none;background:var(--hover);color:var(--text);font-size:15px;cursor:default;display:flex;align-items:center;justify-content:center}
.cal-nav button:hover{background:var(--bg-input)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;flex:1}
.cal-grid .wd{text-align:center;font-size:11px;color:var(--text-3);padding:4px 0;font-weight:600}
.cal-day{position:relative;border-radius:8px;padding:5px;font-size:13px;min-height:44px;cursor:default;color:var(--text)}
.cal-day:hover{background:var(--hover)}
.cal-day.out{color:var(--text-3);opacity:.55}
.cal-day.today{background:var(--accent);color:#fff;font-weight:600}
.cal-day .ev{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--red)}
.cal-day.today .ev{background:#fff}
.cal-ev{font-size:12.5px;color:var(--text-2);padding:0 6px}
.cal-ev b{color:var(--text)}

/* ===================== 音乐 ===================== */
.music-main{flex:1;display:flex;min-width:0;background:var(--win-bg)}
.music-side{width:190px;flex:none;border-right:1px solid var(--sep);padding:12px;display:flex;flex-direction:column;gap:8px;font-size:13px;background:var(--bg)}
.music-side .row{display:flex;align-items:center;gap:9px;padding:5px 10px;border-radius:7px;cursor:default;color:var(--text)}
.music-side .row:hover{background:var(--hover)}
.music-side .row.on{background:var(--sel);color:var(--accent)}
.music-side .row svg{width:16px;height:16px;fill:currentColor}
.music-play{flex:1;display:flex;flex-direction:column;min-width:0}
.music-hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;overflow:hidden}
.vinyl{width:150px;height:150px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.vinyl::before{content:"";position:absolute;inset:14px;border-radius:50%;background:rgba(0,0,0,.28)}
.vinyl::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:var(--win-bg);border:5px solid rgba(255,255,255,.9)}
.vinyl.spin{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.music-tt{font-size:17px;font-weight:700;text-align:center}
.music-ar{font-size:13px;color:var(--text-2)}
.music-ctl{display:flex;align-items:center;gap:22px;color:var(--text)}
.music-ctl svg{width:22px;height:22px;fill:currentColor;cursor:pointer;transition:transform .1s}
.music-ctl svg:hover{transform:scale(1.12)}
.music-ctl .play-big{width:46px;height:46px}
.music-prog{display:flex;align-items:center;gap:10px;width:min(420px,80%);font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.music-prog .bar{flex:1;height:5px;border-radius:3px;background:var(--bg-input);position:relative;cursor:pointer}
.music-prog .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent);width:0}
.music-list{flex:none;border-top:1px solid var(--sep);max-height:132px;overflow-y:auto;padding:6px}
.music-trk{display:flex;align-items:center;gap:10px;padding:5px 10px;border-radius:7px;font-size:13px;cursor:default}
.music-trk:hover{background:var(--hover)}
.music-trk.playing{color:var(--accent);font-weight:600}
.music-trk .idx{width:16px;color:var(--text-3);font-variant-numeric:tabular-nums}
.music-trk .dur{margin-left:auto;color:var(--text-3);font-size:11.5px}

/* ===================== 照片 ===================== */
.photos-main{flex:1;display:flex;min-width:0}
.photos-grid{flex:1;overflow-y:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px;align-content:start;background:var(--win-bg)}
.photo{aspect-ratio:1;border-radius:6px;cursor:pointer;position:relative;overflow:hidden;background-size:cover;background-position:center}
.photo:hover{outline:3px solid var(--accent);outline-offset:-3px}
.photo .pt{position:absolute;left:0;right:0;bottom:0;padding:14px 8px 6px;font-size:11px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55));opacity:0;transition:opacity .2s}
.photo:hover .pt{opacity:1}
#lightbox{position:fixed;inset:0;z-index:8000;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;flex-direction:column}
#lightbox.show{display:flex}
#lightbox .lb-img{width:min(76vw,860px);aspect-ratio:3/2;border-radius:10px;background-size:cover;background-position:center;box-shadow:0 20px 80px rgba(0,0,0,.6)}
#lightbox .lb-cap{color:#fff;font-size:14px;margin-top:16px}
#lightbox .lb-x{position:absolute;top:20px;right:24px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff}
#lightbox .lb-x svg{width:16px;height:16px;fill:currentColor}
#lightbox .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff}
#lightbox .lb-nav svg{width:20px;height:20px;fill:currentColor}
#lightbox .lb-prev{left:20px}#lightbox .lb-next{right:20px}

/* ===================== 系统设置 ===================== */
.set-main{flex:1;display:flex;min-width:0}
.set-pane{flex:1;overflow-y:auto;padding:26px 30px}
.set-pane h2{font-size:21px;font-weight:700;margin-bottom:18px}
.set-card{background:var(--bg);border:1px solid var(--sep);border-radius:12px;margin-bottom:14px;overflow:hidden}
.set-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--sep);font-size:13.5px;cursor:default}
.set-row:last-child{border-bottom:none}
.set-row:hover{background:var(--hover)}
.set-row .ico{width:30px;height:30px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.set-row .ico svg{width:16px;height:16px;fill:currentColor}
.set-row .tt{font-weight:600}
.set-row .sub{font-size:12px;color:var(--text-3);margin-top:1px}
.set-row .val{margin-left:auto;font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:8px}
.set-seg{display:flex;background:var(--bg-input);border-radius:8px;padding:2px}
.set-seg .opt{padding:4px 14px;border-radius:6px;font-size:13px;cursor:default}
.set-seg .opt.on{background:var(--win-bg);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:500}
.wp-thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.wp-thumb{aspect-ratio:16/10;border-radius:10px;background-size:cover;background-position:center;cursor:pointer;border:3px solid transparent;position:relative;overflow:hidden}
.wp-thumb.on{border-color:var(--accent)}
.wp-thumb .ck{position:absolute;right:8px;top:8px;width:22px;height:22px;border-radius:50%;background:var(--accent);display:none;align-items:center;justify-content:center;color:#fff}
.wp-thumb.on .ck{display:flex}
.wp-thumb .ck svg{width:12px;height:12px;fill:currentColor}
.about-hero{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 0 12px}
.about-hero .mac{width:150px;height:auto}
.about-hero h2{font-size:24px;font-weight:700}
.about-hero .sub{font-size:13px;color:var(--text-2)}
.storage-bar{height:12px;border-radius:6px;background:var(--bg-input);overflow:hidden;display:flex;margin-top:10px}
.storage-bar i{height:100%;display:block}
.storage-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--text-2)}
.storage-legend .lg{display:flex;align-items:center;gap:5px}
.storage-legend .lg i{width:10px;height:10px;border-radius:3px;display:block}

/* ===================== 文本编辑 ===================== */
.te-body{flex:1;display:flex;flex-direction:column}
.te-bar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg);border-bottom:1px solid var(--sep);flex:none}
.te-bar input{background:transparent;border:none;outline:none;font-size:13px;font-weight:600;color:var(--text);flex:1;min-width:0}
.te-area{flex:1;border:none;outline:none;resize:none;padding:18px 22px;font-size:14px;line-height:1.7;background:var(--win-bg);color:var(--text);font-family:inherit;user-select:text}

/* ===================== 废纸篓 ===================== */
.trash-body{flex:1;display:flex;flex-direction:column;padding:14px;gap:10px}
.trash-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.trash-row{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:7px;font-size:13.5px}
.trash-row:hover{background:var(--hover)}
.trash-row svg{width:22px;height:22px}

/* ===================== 关于本机弹窗 ===================== */
.abt-inner{flex:1;display:flex;flex-direction:column;overflow-y:auto}
.abt-tabs{display:flex;gap:2px;padding:10px 16px 0;border-bottom:1px solid var(--sep);font-size:13px}
.abt-tabs .tab{padding:7px 14px;border-radius:7px 7px 0 0;cursor:default;color:var(--text-2)}
.abt-tabs .tab.on{color:var(--accent);font-weight:600}
.abt-tab{flex:1;padding:20px 26px;overflow-y:auto}

/* ===================== 响应式 ===================== */
@media (max-width:820px){
  .menu-item.m-hide{display:none}
  #menu-clock .full{display:none}
  #menu-clock .mini{display:inline}
  .dock-icon{width:44px;height:44px}
  .sidebar{width:150px}
  .msg-list,.mail-list,.notes-list{width:190px}
  #control-center{width:300px}
  .set-pane{padding:18px}
}
@media (max-width:560px){
  .menu-appname{max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #menu-bar .menu-item{padding:0 6px}
  .dock-icon{width:40px;height:40px}
  #dock{gap:4px;padding:6px 8px}
  .lp-app .lp-ic{width:60px;height:60px}
  .window{min-width:200px}
  .music-side{display:none}
}
@media (hover:none){
  .dock-icon{transition:none}
}
body.reduced *{animation-duration:.01s !important;transition-duration:.01s !important}

<script>
"use strict";
/* ===================== 工具 ===================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let _uid=0; const uid=()=>'u'+(++_uid);
function toast(msg,ms=1800){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),ms);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const pad=n=>String(n).padStart(2,'0');
/* 登录密码：默认 123456，可在 系统设置 → 密码 中修改 */
let PW=localStorage.getItem('macos_pw')||'123456';
function setPW(p){PW=p;localStorage.setItem('macos_pw',p);if(typeof updateLoginHint==='function')updateLoginHint();}
/* 苹果设备直接使用 字符（U+F8FF）渲染苹果标志，其余设备用内联 SVG */
const IS_APPLE=/Mac|iPhone|iPad|iPod/i.test(navigator.userAgent+' '+navigator.platform);

/* ===================== 主题与壁纸 ===================== */
const WP={
  0:{name:'流动', cls:'',      url:'url("https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/G1fgb6LPWorKihxvpjhc4p8FnVc")'},
  1:{name:'渐变光',cls:'',     url:'linear-gradient(135deg,#ff9a9e 0%,#fecfef 30%,#a1c4fd 70%,#c2e9fb 100%)'},
  2:{name:'午夜', cls:'wallpaper-dark', url:'linear-gradient(160deg,#0f2027 0%,#203a43 45%,#2c5364 100%)'}
};
let wpIdx=+(localStorage.getItem('macos_wp')||0);
function setWallpaper(i,persist=true){
  wpIdx=i; document.documentElement.style.setProperty('--wallpaper',WP[i].url);
  document.body.classList.toggle('wallpaper-dark',!!WP[i].cls);
  if(persist)localStorage.setItem('macos_wp',i);
  $$('.wp-thumb').forEach((t,k)=>t.classList.toggle('on',k===i));
}
setWallpaper(wpIdx,false);

/* ===================== 时钟 ===================== */
function tickClock(){
  const n=new Date();
  const wd=['周日','周一','周二','周三','周四','周五','周六'][n.getDay()];
  const d=$('#menu-clock');
  d.innerHTML=`<span class="full">${wd} ${n.getMonth()+1}月${n.getDate()}日</span><span class="mini">${n.getMonth()+1}/${n.getDate()}</span>&nbsp;${pad(n.getHours())}:${pad(n.getMinutes())}`;
  d.title=`${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日 ${wd} ${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
}
setInterval(tickClock,5000); tickClock();

/* ===================== 虚拟文件系统 ===================== */
const FS={
  '/':{'type':'dir','children':{
    'Applications':{'type':'dir','children':{
      '访达.app':{'type':'app','id':'finder'},
      'Safari.app':{'type':'app','id':'safari'},
      '备忘录.app':{'type':'app','id':'notes'},
      '终端.app':{'type':'app','id':'terminal'},
      '计算器.app':{'type':'app','id':'calculator'},
      '系统设置.app':{'type':'app','id':'settings'},
      '音乐.app':{'type':'app','id':'music'},
      '文本编辑.app':{'type':'app','id':'textedit'},
      '邮件.app':{'type':'app','id':'mail'},
      '信息.app':{'type':'app','id':'messages'},
      '照片.app':{'type':'app','id':'photos'},
      '日历.app':{'type':'app','id':'calendar'}
    }},
    'System':{'type':'dir','children':{}},
    'Users':{'type':'dir','children':{
      '访客':{'type':'dir','children':{
        'Desktop':{'type':'dir','children':{}},
        'Documents':{'type':'dir','children':{
          '项目计划.md':{'type':'file','content':'# 项目计划\n\n- 第一阶段：需求梳理\n- 第二阶段：界面复刻\n- 第三阶段：交互打磨\n\n> 用 HTML + CSS + JS 复刻 macOS 桌面。'},
          '会议纪要.txt':{'type':'file','content':'2026年9月25日 周会纪要\n\n1. 完成桌面框架搭建\n2. 窗口拖拽与缩放已就绪\n3. 下一步：打磨应用细节'},
          '预算.xlsx':{'type':'file','content':'# 预算表（演示文件）\n'}
        }},
        'Downloads':{'type':'dir','children':{
          'macos-clone.zip':{'type':'file','content':'zip 演示文件'},
          '壁纸.png':{'type':'file','content':'png 演示文件'},
          '说明.txt':{'type':'file','content':'下载目录演示文件'}
        }},
        'Pictures':{'type':'dir','children':{
          '2026 旅行':{'type':'dir','children':{}},
          '头像.png':{'type':'file','content':'png 演示文件'}
        }},
        'Music':{'type':'dir','children':{
          '我的歌单':{'type':'dir','children':{}}
        }},
        'Movies':{'type':'dir','children':{
          '演示视频.mov':{'type':'file','content':'mov 演示文件'}
        }},
        '.Trash':{'type':'dir','children':{}}
      }}
    }}
  }}
};
function node(path){
  const p=path.replace(/\/+/g,'/').replace(/\/$/,'')||'/';
  const parts=p.split('/').filter(Boolean);
  let n=FS['/'], cur='/';
  for(const part of parts){ if(n.type!=='dir'||!n.children)return null; if(!(part in n.children))return null; n=n.children[part]; cur+='/'+part; }
  return n;
}
function ls(path){const n=node(path);return n&&n.type==='dir'?n.children:null;}
function mkdir(path){const parts=path.replace(/\/+/g,'/').split('/').filter(Boolean);let n=FS['/'];for(let i=0;i<parts.length-1;i++){if(!n.children[parts[i]])return false;n=n.children[parts[i]];}if(!n.children||n.children[parts[parts.length-1]])return false;n.children[parts[parts.length-1]]={'type':'dir','children':{}};return true;}
function writeFile(path,content){const parts=path.replace(/\/+/g,'/').split('/').filter(Boolean);let n=FS['/'];for(let i=0;i<parts.length-1;i++){if(!n.children[parts[i]])return false;n=n.children[parts[i]];}if(!n.children)return false;n.children[parts[parts.length-1]]={'type':'file','content':content};return true;}
function rmToTrash(path){
  const parts=path.replace(/\/+/g,'/').split('/').filter(Boolean);const name=parts.pop();
  let n=FS['/'];for(const p of parts){if(!n.children[p])return false;n=n.children[p];}
  if(!n.children||!(name in n.children))return false;
  const trash=FS['/'].children.Users.children['访客'].children['.Trash'];
  trash.children[name]=n.children[name]; delete n.children[name]; return true;
}
function fileSize(node){if(!node)return 0;if(node.type==='file')return Math.max(64,(node.content||'').length*3);let s=0;for(const k in node.children)s+=fileSize(node.children[k]);return s;}
function fmtSize(n){if(n>1048576)return (n/1048576).toFixed(1)+' MB';if(n>1024)return Math.round(n/1024)+' KB';return n+' B';}

/* ===================== 应用图标 ===================== */
function ic(bg1,bg2,inner){
  const g=uid();
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="${g}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${bg1}"/><stop offset="1" stop-color="${bg2}"/></linearGradient></defs><rect width="100" height="100" rx="22" fill="url(#${g})"/>${inner}</svg>`;
}
const fnt='font-family="Arial,Helvetica,sans-serif"';
const ICONS={
  finder:()=>ic('#4cc9ff','#0a5cff',
    `<path d="M50 21c-15.5 0-27 10.8-27 26.6 0 18 12.5 29.4 27 29.4s27-11.4 27-29.4C77 31.8 65.5 21 50 21z" fill="none" stroke="#fff" stroke-width="4.6"/>
     <path d="M34 38h.01M66 38h.01" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
     <path d="M38 56c3.2 2.6 7.6 4 12 4s8.8-1.4 12-4" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/>
     <path d="M38 44c-1.6 2.4-2.4 5.6-1.8 8.6.6 3 2.4 5.4 5 6.8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".55"/>`),
  launchpad:()=>ic('#141416','#3a3a40',
    [35,50,65].map(y=>[32,50,68].map(x=>`<rect x="${x-4}" y="${y-4}" width="8" height="8" rx="2.4" fill="#fff"/>`).join('')).join('')),
  safari:()=>ic('#23b6f0','#0b63e0',
    `<circle cx="50" cy="50" r="37" fill="#f8fafc"/>
     <circle cx="50" cy="50" r="37" fill="none" stroke="#fff" stroke-width="5" opacity=".35"/>
     <path d="M50 50 L72 28 L58 52 Z" fill="#ff3b30"/><path d="M50 50 L28 72 L42 48 Z" fill="#fff"/>
     <circle cx="50" cy="50" r="4.4" fill="#ff3b30"/>`),
